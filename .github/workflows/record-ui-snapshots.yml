name: Record UI Snapshots

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5'

    - name: Force-select Xcode app (26.5 -> 26.4.1 -> 26.3)
      run: |
        set -euo pipefail
        CANDIDATES=(
          "/Applications/Xcode_26.5.app/Contents/Developer"
          "/Applications/Xcode_26.4.1.app/Contents/Developer"
          "/Applications/Xcode_26.4.app/Contents/Developer"
          "/Applications/Xcode_26.3.app/Contents/Developer"
          "/Applications/Xcode_26.3.0.app/Contents/Developer"
          "/Applications/Xcode.app/Contents/Developer"
        )
        SELECTED=""
        for p in "${CANDIDATES[@]}"; do
          if [ -d "$p" ]; then
            SELECTED="$p"
            break
          fi
        done
        if [ -n "$SELECTED" ]; then
          echo "Selecting Xcode at: $SELECTED"
          sudo xcode-select -s "$SELECTED"
          echo "DEVELOPER_DIR=$SELECTED" >> $GITHUB_ENV
        else
          echo "No preferred Xcode app path found among candidates."
          exit 1
        fi

    - name: Record SourceListSnapshotTests
      # record モードは XCTest を意図的に失敗させるが、参照 PNG はディスクに書き込まれる
      run: SNAPSHOT_TESTING_RECORD=all swift test --filter SourceListSnapshotTests || true

    - name: Upload reference PNGs
      uses: actions/upload-artifact@v6
      with:
        name: ui-snapshots
        path: Tests/S2JSourceListTests/__Snapshots__/
        if-no-files-found: error